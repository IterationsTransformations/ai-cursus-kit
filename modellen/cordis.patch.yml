# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openrouter:
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        compat:
          thinkingFormat: openrouter
        models:
          - id: deepseek/deepseek-v4.1-flash-1017
            name: "1 DeepSeek V4.1 Flash 1017 ($0.036 / $0.50)"
            contextWindow: 1048576
            maxTokens: 128000
            input: [text, image]
            compat:
              supportsDeveloperRole: false
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
          - id: anthropic/claude-haiku-5.5
            name: "2 Claude Haiku 5.5 ($0.10 / $0.50)"
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: openai/gpt-6.1-terra
            name: "3 GPT-6.1 Terra ($1 / $5) - standaard"
            contextWindow: 1050000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: google/gemini-4-hydrogen
            name: "4 Gemini 4 Hydrogen ($1.50 / $7.50)"
            contextWindow: 1048576
            maxTokens: 65536
            input: [text, image]
            compat:
              supportsDeveloperRole: false
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: openai/gpt-6.1-sol
            name: "5 GPT-6.1 Sol ($2 / $10)"
            contextWindow: 1050000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: anthropic/claude-opus-5.5
            name: "6 Claude Opus 5.5 ($4 / $20)"
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: google/gemini-4-carbon
            name: "7 Gemini 4 Carbon ($2 / $10)"
            contextWindow: 1048576
            maxTokens: 65536
            input: [text, image]
            compat:
              supportsDeveloperRole: false
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: anthropic/claude-fable-5.2
            name: "8 Claude Fable 5.2 ($8 / $40)"
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openrouter
    model: openai/gpt-6.1-terra
    reasoningEffort: high
